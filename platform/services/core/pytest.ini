[pytest]
testpaths = tests
pythonpath = src
asyncio_mode = auto
# Function-scoped loops, with a per-test asyncpg pool (see tests/conftest.py).
# Sharing a session-scoped pool across function-scoped loops produces
# "attached to a different loop" errors that read like database faults and
# are not. Per-test pools cost milliseconds and remove the confusion.
asyncio_default_fixture_loop_scope = function
addopts = -q --strict-markers
markers =
    integration: needs a live postgres
filterwarnings =
    error::DeprecationWarning:jarvis.*
