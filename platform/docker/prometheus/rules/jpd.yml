# GENERATED by jarvis — do not edit. Edit observability/alerts.py.
groups:
  - name: jpd
    rules:
      - alert: UndeliveredPaidOrders
        expr: "jpd_undelivered_paid_orders > 0"
        for: 5m
        labels:
          severity: critical
          platform: jpd
        annotations:
          summary: "A buyer paid and has not received everything they bought"
          rationale: "The single most important question this system can be asked. Pimlico's three delivery tokens all point at files that do not exist."
          synthetic: "yes"
      - alert: BuyerNotNotified
        expr: "jpd_notifications_owed > 0"
        for: 15m
        labels:
          severity: critical
          platform: jpd
        annotations:
          summary: "Money taken and the buyer has not been told"
          rationale: "A notification that never sent produces no error anywhere: the payment succeeded, the entitlement exists, the artifact is on disk, only the email is missing."
          synthetic: "yes"
      - alert: ArtifactMissing
        expr: "jpd_artifacts_missing > 0"
        for: 10m
        labels:
          severity: critical
          platform: jpd
        annotations:
          summary: "An artifact behind a live download token is not on disk"
          rationale: "A file that existed at mint time can vanish afterwards. The buyer must never be the monitoring system."
          synthetic: "yes"
      - alert: ConnectorRegressed
        expr: "jpd_connectors_regressed > 0"
        for: 30m
        labels:
          severity: warning
          platform: jpd
        annotations:
          summary: "A connector that used to work has stopped working"
          rationale: "C3. Deliberately NOT `dormant > 0`: 17 of 24 connectors are dormant by design, waiting on credentials, so that alert fired permanently and would have been learned-and-ignored. 'It worked once and does not now' is the actionable signal; 'never configured' is a setup task."
          synthetic: "yes"
      - alert: NoLiveConnectors
        expr: "jpd_connectors_live == 0"
        for: 15m
        labels:
          severity: critical
          platform: jpd
        annotations:
          summary: "No connector is live — the funnel cannot harvest anything"
          rationale: "Distinct from ConnectorDormant: one dormant source degrades the funnel, zero live sources stops it entirely."
          synthetic: "yes"
      - alert: HumanTaskUnannounced
        expr: "jpd_human_tasks_unannounced > 0"
        for: 10m
        labels:
          severity: warning
          platform: jpd
        annotations:
          summary: "An open human task was never posted to Telegram"
          rationale: "The task exists and the run is visibly blocked, but nobody was told. Recoverable by a retry — and invisible without this."
          synthetic: "yes"
      - alert: HumanTaskStale
        expr: "jpd_human_tasks_open_by_age{age_bucket=\"gte_3d\"} > 0"
        for: 1h
        labels:
          severity: warning
          platform: jpd
        annotations:
          summary: "A human task has been open for more than three days"
          rationale: "An expired approval silently stalled a Pimlico build for five days. If this queue grows, the design is wrong and you need to see it."
          synthetic: "yes"
      - alert: ConnectorSweepStale
        expr: "jpd_connector_sweep_last_success_timestamp > 0 and time() - jpd_connector_sweep_last_success_timestamp > 1350"
        for: 5m
        labels:
          severity: warning
          platform: jpd
        annotations:
          summary: "Connector health has not been swept in over 22 minutes"
          rationale: "Derived: expected 900s x 1.5. Without sweeps the dormancy state machine stops updating and every connector looks frozen in its last state."
          synthetic: "yes"
      - alert: HarvestStale
        expr: "jpd_harvest_last_success_timestamp > 0 and time() - jpd_harvest_last_success_timestamp > 129600"
        for: 30m
        labels:
          severity: warning
          platform: jpd
        annotations:
          summary: "No successful harvest in over 36 hours"
          rationale: "Derived: expected 86400s x 1.5. Pimlico's NoSuccessfulScan was hardcoded at 10 days for a weekly job, so it needed two consecutive misses to fire."
          synthetic: "yes"
      - alert: ServiceDown
        expr: "jpd_up == 0 or jpd_commerce_up == 0 or jpd_console_up == 0"
        for: 2m
        labels:
          severity: critical
          platform: jpd
        annotations:
          summary: "A JPD service has stopped"
          rationale: "Three separate services; any of them being down means a different capability is gone. STRUCTURALLY UNVERIFIABLE by a synthetic: proving it would mean stopping a service in production. Verified instead by the phase-2 C7 exercise, where core was scaled to 0/0 by hand."
          synthetic: "NONE - this rule is UNVERIFIED"
      - alert: AlertNeverTripped
        expr: "jpd_alert_synthetic_age_days > 10"
        for: 1h
        labels:
          severity: warning
          platform: jpd
        annotations:
          summary: "An alert rule has not been synthetically verified in 10 days"
          rationale: "THE POINT OF ALL THIS. Pimlico shipped eleven rules and four of its detectors are silently broken today. An untested detector is not a detector — including this one, which is why it has a synthetic of its own."
          synthetic: "yes"
